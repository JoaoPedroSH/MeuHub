services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: meuhub_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: meuhub
      DB_USERNAME: meuhub
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    networks:
      - meuhub_network

  web:
    image: nginx:alpine
    container_name: meuhub_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - meuhub_network

  db:
    image: postgres:16-alpine
    container_name: meuhub_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meuhub
      POSTGRES_USER: meuhub
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meuhub -d meuhub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - meuhub_network

  node:
    image: node:22-alpine
    container_name: meuhub_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - app
    networks:
      - meuhub_network

volumes:
  postgres_data:
    driver: local

networks:
  meuhub_network:
    driver: bridge
